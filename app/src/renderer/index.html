<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src https: data:; media-src https: file: data: blob:; font-src 'self';"
    />
    <title>Music Grabber</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="shell">
      <!-- ---------------------------------------------- ліва панель -->
      <aside class="nav">
        <div class="brand">
          <span class="logo" data-icon="note"></span> Music&nbsp;Grabber
        </div>

        <button class="navbtn active" data-page="home">
          <span class="nico" data-icon="home"></span> Головна
        </button>
        <button class="navbtn" data-page="search">
          <span class="nico" data-icon="search"></span> Шукач
        </button>
        <button class="navbtn" data-page="queue">
          <span class="nico" data-icon="download"></span> Черга
          <b class="nbadge" id="navQueue" hidden>0</b>
        </button>
        <button class="navbtn" data-page="library">
          <span class="nico" data-icon="library"></span> Сховище
        </button>
        <button class="navbtn" data-page="playlists">
          <span class="nico" data-icon="playlist"></span> Плейлисти
        </button>
        <button class="navbtn" data-page="settings">
          <span class="nico" data-icon="settings"></span> Налаштування
        </button>

        <div class="navfoot">
          Качай лише те, на що маєш право: власні записи, вільні ліцензії,
          суспільне надбання.
        </div>
      </aside>

      <!-- ---------------------------------------------- вміст -->
      <div class="content">
        <!-- Підказка стоїть НАД рядком пошуку: саме туди дивишся, коли щойно
             скопіював посилання, і саме там на неї треба реагувати. -->
        <div class="toast" id="toast" hidden>
          <span id="toastText"></span>
          <span class="tacts" id="toastActs"></span>
          <button class="tclose" id="toastClose" data-icon="close" title="Сховати"></button>
        </div>

        <header class="topbar" id="topbar">
          <form class="searchbox" id="searchForm" autocomplete="off">
            <span class="sico" data-icon="search"></span>
            <input
              id="q"
              type="text"
              placeholder="Виконавець, альбом, пісня — або встав посилання"
              spellcheck="false"
            />
            <button type="submit" id="go">Шукати</button>
            <button type="button" id="stop" class="ghost" hidden>Стоп</button>
          </form>
        </header>

        <div id="warn" class="warn" hidden></div>
        <div id="netbar" class="netbar" hidden><i></i></div>

        <nav class="tabs" id="tabs" hidden>
          <button class="tab active" data-tab="songs">Треки <b class="cnt">0</b></button>
          <button class="tab" data-tab="albums">Альбоми <b class="cnt">0</b></button>
          <button class="tab" data-tab="artists">Виконавці <b class="cnt">0</b></button>

          <div class="sources" id="sources">
            <label><input type="checkbox" value="ytmusic" checked /> YouTube Music</label>
            <label><input type="checkbox" value="youtube" checked /> YouTube</label>
            <label><input type="checkbox" value="soundcloud" checked /> SoundCloud</label>
            <label><input type="checkbox" value="itunes" checked /> iTunes</label>
            <label><input type="checkbox" value="musicbrainz" checked /> MusicBrainz</label>
          </div>
        </nav>

        <main id="main"></main>
      </div>
    </div>

    <!-- ---------------------------------------------- нижній плеєр -->
    <div class="player idle" id="player">
      <img class="part" id="plArt" alt="" />
      <div class="pinfo">
        <b id="plTitle">Нічого не грає</b>
        <small id="plArtist">Обери трек у Сховищі або в пошуку</small>
      </div>
      <button class="pbtn small" id="plShuffle" title="Перемішати" data-icon="shuffle"></button>
      <button class="pbtn" id="plPrev" title="Попередній" data-icon="prev" disabled></button>
      <button class="pbtn big" id="plPlay" title="Грати / пауза" data-icon="play" disabled></button>
      <button class="pbtn" id="plNext" title="Наступний" data-icon="next" disabled></button>
      <button class="pbtn small" id="plRepeat" title="Повтор" data-icon="repeat"></button>
      <div class="pseek">
        <input type="range" id="plSeek" min="0" max="1000" value="0" disabled />
        <span class="ptime"><span id="plNow">0:00</span> / <span id="plEnd">0:00</span></span>
      </div>
      <button class="pbtn small heart" id="plFav" title="В улюблене" data-icon="heart"></button>
      <button class="pbtn small" id="plRadio" title="Радіо за цим треком" data-icon="radio"></button>
      <button class="pbtn small" id="plLyrics" title="Текст пісні" data-icon="lyrics"></button>
      <span class="vico" data-icon="volume"></span>
      <input type="range" id="plVol" class="pvol" min="0" max="100" value="80" />
      <audio id="audio"></audio>
    </div>

    <!-- ---------------------------------------------- спливні -->
    <div class="selbar" id="selbar" hidden>
      <span id="selCount">0 вибрано</span>
      <button id="selNone" class="ghost">Зняти вибір</button>
      <button id="selDl" class="primary">ЗАБИРАЮ!</button>
      <button id="selTags" class="ghost" hidden>Змінити теги</button>
      <button id="selPl" class="primary" hidden>У плейлист</button>
    </div>

    <div class="lyrics" id="lyricsPanel" hidden>
      <header>
        <b id="lyricsTitle">Текст пісні</b>
        <span class="grow"></span>
        <button class="ghost" id="lyricsClose" data-icon="close" title="Закрити"></button>
      </header>
      <div class="lbody" id="lyricsBody"></div>
    </div>

    <!-- Власне вікно вводу: window.prompt() в Electron не просто не працює,
         а кидає виняток і рве весь обробник кліку. -->
    <div class="modal" id="askModal" hidden>
      <div class="mbox">
        <h3 id="askTitle">Назва</h3>
        <label class="field">
          <span id="askLabel">Введи назву</span>
          <input type="text" id="askInput" spellcheck="false" />
        </label>
        <div class="mact">
          <button class="ghost" id="askCancel">Скасувати</button>
          <button class="primary" id="askOk">Гаразд</button>
        </div>
      </div>
    </div>

    <div class="modal" id="plModal" hidden>
      <div class="mbox">
        <h3>Додати в плейлист</h3>
        <div class="mnote" id="plModalCount"></div>
        <div id="plModalList" class="pllist"></div>
        <label class="field">
          <span>Або створити новий</span>
          <input type="text" id="plNewName" placeholder="Назва плейлиста" spellcheck="false" />
        </label>
        <div class="mact">
          <button class="ghost" id="plCancel">Скасувати</button>
          <button class="primary" id="plCreateAdd">Створити й додати</button>
        </div>
      </div>
    </div>

    <div class="modal" id="tagModal" hidden>
      <div class="mbox">
        <h3 id="tagHead">Змінити теги</h3>
        <div class="mnote" id="tagFiles"></div>
        <label class="field">
          <span>Виконавець</span>
          <input type="text" id="tagArtist" spellcheck="false" />
        </label>
        <label class="field" id="tagTitleWrap">
          <span>Назва</span>
          <input type="text" id="tagTitle" spellcheck="false" />
        </label>
        <label class="field">
          <span>Альбом</span>
          <input type="text" id="tagAlbum" spellcheck="false" />
        </label>
        <label class="switch">
          <input type="checkbox" id="tagRename" checked />
          Перейменувати файли за схемою «Виконавець - Назва»
        </label>
        <div class="mnote" id="tagHint"></div>
        <div class="mact">
          <button class="ghost" id="tagCancel">Скасувати</button>
          <button class="primary" id="tagSave">Зберегти</button>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>

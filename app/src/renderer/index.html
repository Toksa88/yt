<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src https: data:; media-src file: data: blob:; font-src 'self';"
    />
    <title>Music Grabber</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="shell">
      <!-- ---------------------------------------------- ліва панель -->
      <aside class="nav">
        <div class="brand"><span class="logo">♫</span> Music&nbsp;Grabber</div>

        <button class="navbtn active" data-page="search">
          <span class="nico">⌕</span> Шукач
        </button>
        <button class="navbtn" data-page="queue">
          <span class="nico">↓</span> Черга <b class="nbadge" id="navQueue" hidden>0</b>
        </button>
        <button class="navbtn" data-page="library">
          <span class="nico">♬</span> Сховище
        </button>
        <button class="navbtn" data-page="settings">
          <span class="nico">⚙</span> Налаштування
        </button>

        <div class="navfoot">
          Качай лише те, на що маєш право: власні записи, вільні ліцензії,
          суспільне надбання.
        </div>
      </aside>

      <!-- ---------------------------------------------- вміст -->
      <div class="content">
        <header class="topbar" id="topbar">
          <form class="searchbox" id="searchForm" autocomplete="off">
            <span class="sico">⌕</span>
            <input
              id="q"
              type="text"
              placeholder="Виконавець, альбом, пісня — або встав посилання"
              spellcheck="false"
            />
            <button type="submit" id="go">Шукати</button>
            <button type="button" id="stop" class="ghost" hidden>Стоп</button>
          </form>
        </header>

        <div id="warn" class="warn" hidden></div>
        <div id="netbar" class="netbar" hidden><i></i></div>

        <nav class="tabs" id="tabs" hidden>
          <button class="tab active" data-tab="songs">Треки <b class="cnt">0</b></button>
          <button class="tab" data-tab="albums">Альбоми <b class="cnt">0</b></button>
          <button class="tab" data-tab="artists">Виконавці <b class="cnt">0</b></button>

          <div class="sources" id="sources">
            <label><input type="checkbox" value="ytmusic" checked /> YouTube Music</label>
            <label><input type="checkbox" value="soundcloud" checked /> SoundCloud</label>
            <label><input type="checkbox" value="itunes" checked /> iTunes</label>
            <label><input type="checkbox" value="musicbrainz" checked /> MusicBrainz</label>
          </div>
        </nav>

        <main id="main"></main>
      </div>
    </div>

    <!-- ---------------------------------------------- нижній плеєр -->
    <div class="player idle" id="player">
      <img class="part" id="plArt" alt="" />
      <div class="pinfo">
        <b id="plTitle">Нічого не грає</b>
        <small id="plArtist">Натисни ▶ на треку у Сховищі</small>
      </div>
      <button class="pbtn big" id="plPlay" title="Грати / пауза" disabled>▶</button>
      <div class="pseek">
        <input type="range" id="plSeek" min="0" max="1000" value="0" disabled />
        <span class="ptime"><span id="plNow">0:00</span> / <span id="plEnd">0:00</span></span>
      </div>
      <span class="vico">🔊</span>
      <input type="range" id="plVol" class="pvol" min="0" max="100" value="80" />
      <audio id="audio"></audio>
    </div>

    <!-- ---------------------------------------------- спливні -->
    <div class="selbar" id="selbar" hidden>
      <span id="selCount">0 вибрано</span>
      <button id="selNone" class="ghost">Зняти вибір</button>
      <button id="selDl" class="primary">ЗАБИРАЮ!</button>
    </div>

    <div class="toast" id="toast" hidden>
      <span id="toastText"></span>
      <span class="tacts" id="toastActs"></span>
      <button class="tclose" id="toastClose">✕</button>
    </div>

    <script src="app.js"></script>
  </body>
</html>
